<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce Org API Reference</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1c2128;
    --muted: #5b6472;
    --accent: #2f6feb;
    --get: #2e8b57;
    --post: #2f6feb;
    --put: #b8860b;
    --patch: #6f42c1;
    --delete: #cc3333;
    --code-bg: #0d1117;
    --code-text: #d7e0ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 1.5rem; }
  header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 12px 32px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
  }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #search {
    flex: 1;
    min-width: 200px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
  }
  main { padding: 20px 32px 60px; max-width: 1100px; margin: 0 auto; }
  .panel { display: none; flex-direction: column; gap: 12px; }
  .panel.active { display: flex; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .method {
    font-weight: 700;
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 4px;
    color: #fff;
    min-width: 60px;
    text-align: center;
    flex-shrink: 0;
  }
  .method.get { background: var(--get); }
  .method.post { background: var(--post); }
  .method.put { background: var(--put); }
  .method.patch { background: var(--patch); }
  .method.delete { background: var(--delete); }
  .endpoint { font-family: "SF Mono", Consolas, monospace; font-size: 0.9rem; flex: 1; word-break: break-all; }
  .source { color: var(--muted); font-size: 0.8rem; flex-shrink: 0; }
  .chevron { transition: transform 0.15s; color: var(--muted); flex-shrink: 0; }
  .card.open .chevron { transform: rotate(90deg); }
  .card-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
  .card.open .card-body { display: block; }
  .card-body p.description { color: var(--muted); margin: 12px 0; font-size: 0.9rem; }
  .card-body p.notes { color: var(--put); margin: 12px 0; font-size: 0.85rem; font-style: italic; }
  .json-block { margin: 12px 0; }
  .json-block h4 { margin: 0 0 6px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
  pre {
    background: var(--code-bg);
    color: var(--code-text);
    padding: 12px 14px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 0.82rem;
    margin: 0;
  }
</style>
</head>
<body>

<header>
  <h1>Salesforce Org API Reference</h1>
  <p>Generated from local Apex classes and Flows. Examples are illustrative, derived from source — not real production data.</p>
</header>

<div class="toolbar">
  <div class="tabs">
    <button class="tab active" data-tab="outbound">Outbound API Calls</button>
    <button class="tab" data-tab="inbound">Inbound REST Resources</button>
  </div>
  <input id="search" type="text" placeholder="Filter by endpoint, class, or method...">
</div>

<main>
  <div id="outbound" class="panel active"></div>
  <div id="inbound" class="panel"></div>
</main>

<script>
/*
  Fill this object with the endpoints discovered per SKILL.md steps 1-3, then leave
  everything below (render/search/tab logic) untouched.

  outbound[]: { method, endpoint, source, description, requestExample, responseExample, notes? }
    - endpoint: the resolved URL/Named Credential value, e.g. "callout:Mulesoft_Endpoint/v1/promotions"
    - source:   "ClassName.methodName" (or "FlowApiName" for a Flow-based callout)
    - requestExample / responseExample: plain JS objects (rendered as pretty-printed JSON) or the
      string "// shape not statically determinable" when the body/response couldn't be traced to a typed class
    - notes: optional, e.g. "Response status-only, body never deserialized"

  inbound[]: { method, urlMapping, source, description, requestExample, responseExample, notes? }
    - urlMapping: the @RestResource urlMapping value, e.g. "/v1/vouchers/*"
    - source:     "ClassName.methodName"
*/
const API_DATA = {
  outbound: [
    // { method: "POST", endpoint: "callout:Example/v1/resource", source: "MyClass.myMethod",
    //   description: "What triggers this callout.",
    //   requestExample: { exampleField: "value" },
    //   responseExample: { status: "ok" } }
  ],
  inbound: [
    // { method: "GET", urlMapping: "/v1/resource/*", source: "MyRestClass.doGet",
    //   description: "What this endpoint does.",
    //   requestExample: "// shape not statically determinable",
    //   responseExample: { id: "abc123", name: "Example" } }
  ]
};

function renderJson(value) {
  if (typeof value === "string") return value;
  if (value === undefined) return "// none";
  return JSON.stringify(value, null, 2);
}

function methodClass(method) {
  return (method || "").toLowerCase();
}

function buildCard(entry, kind) {
  const card = document.createElement("div");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML = `
    <span class="method ${methodClass(entry.method)}">${entry.method || "?"}</span>
    <span class="endpoint">${kind === "outbound" ? entry.endpoint : entry.urlMapping}</span>
    <span class="source">${entry.source || ""}</span>
    <span class="chevron">&#9656;</span>
  `;
  head.addEventListener("click", () => card.classList.toggle("open"));

  const body = document.createElement("div");
  body.className = "card-body";
  body.innerHTML = `
    ${entry.description ? `<p class="description">${entry.description}</p>` : ""}
    ${entry.notes ? `<p class="notes">${entry.notes}</p>` : ""}
    <div class="json-block"><h4>Request</h4><pre>${renderJson(entry.requestExample)}</pre></div>
    <div class="json-block"><h4>Response</h4><pre>${renderJson(entry.responseExample)}</pre></div>
  `;

  card.appendChild(head);
  card.appendChild(body);
  card.dataset.filter = [entry.method, entry.endpoint, entry.urlMapping, entry.source, entry.description]
    .filter(Boolean).join(" ").toLowerCase();
  return card;
}

function renderPanel(kind) {
  const panel = document.getElementById(kind);
  panel.innerHTML = "";
  const entries = API_DATA[kind] || [];
  if (entries.length === 0) {
    panel.innerHTML = `<div class="empty">No ${kind} entries found.</div>`;
    return;
  }
  entries.forEach(entry => panel.appendChild(buildCard(entry, kind)));
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab).classList.add("active");
  });
});

document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll(".card").forEach(card => {
    card.style.display = card.dataset.filter.includes(q) ? "" : "none";
  });
});

renderPanel("outbound");
renderPanel("inbound");
</script>

</body>
</html>
